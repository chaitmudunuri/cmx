name: Feature request
description: Suggest an idea or improvement for cmx
title: "[feat]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        cmx is deliberately small. Feature requests are weighed against one question:
        *does this keep cmx a fast, native-feel editor — or turn it into something else?*

        That said, "what would you use instead today?" and "what do you do in Vim/VS Code
        that you can't do in cmx?" are both very persuasive answers.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the problem, not the solution. This is the part that matters.
      placeholder: |
        When I open a large generated file, the editor takes several seconds before I
        can scroll, so I end up opening it in a browser tab instead.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editing
        - Vim mode
        - Navigation (explorer, Quick Open, search, tabs)
        - Live preview
        - Theming / fonts
        - Performance / startup
        - Platform / packaging
        - Docs
        - Other
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Optional. A sketch is fine; a spec is not required.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
      description: Other editors, plugins, or workflows that partly solve this today.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for this.
          required: true
        - label: This isn't already supported today.
          required: false