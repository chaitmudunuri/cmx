name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: pnpm build

  rust:
    name: Rust (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - name: Test
        working-directory: src-tauri
        run: cargo test

  lint:
    name: Rust (fmt + clippy) — informational
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      # Informational for now: the codebase still carries pre-existing rustfmt
      # and clippy findings. This job reports them without blocking PRs; flip
      # `continue-on-error` off once it is green on `main`.
      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  readme:
    name: README assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify every screenshot referenced by the README exists
        run: |
          missing=0
          for f in $(grep -oE 'docs/screenshots/[A-Za-z0-9._-]+\.png' README.md | sort -u); do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::README references a missing screenshot"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "All README screenshots present."
          exit "$missing"